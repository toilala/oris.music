name: Bootstrap repo tooling
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix-wrapper:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Replace the broken old Gradle wrapper with the proven modern one
        run: |
          base=https://raw.githubusercontent.com/toilala/oris-music-foundation/main
          curl -fsSL "$base/gradlew" -o gradlew
          curl -fsSL "$base/gradlew.bat" -o gradlew.bat
          curl -fsSL "$base/gradle/wrapper/gradle-wrapper.jar" -o gradle/wrapper/gradle-wrapper.jar
          curl -fsSL "$base/gradle/wrapper/gradle-wrapper.properties" -o gradle/wrapper/gradle-wrapper.properties
          chmod +x gradlew
          ./gradlew --version
      - name: Commit the fix
        run: |
          git config user.name toilala
          git config user.email 129511137+toilala@users.noreply.github.com
          git add gradlew gradlew.bat gradle/wrapper/gradle-wrapper.jar gradle/wrapper/gradle-wrapper.properties
          git commit -m 'Replace broken legacy Gradle wrapper with modern wrapper (Gradle 9.3.1)'
          git push
