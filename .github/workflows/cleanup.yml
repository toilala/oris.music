name: Tidy repo
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: repo-cleanup
  cancel-in-progress: false
jobs:
  tidy:
    if: github.repository == 'toilala/oris-music-rebuilt'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: main
      - name: Backup current history
        run: |
          set -euo pipefail
          test "$(git remote get-url origin)" = 'https://github.com/toilala/oris-music-rebuilt'
          git config user.name toilala
          git config user.email 129511137+toilala@users.noreply.github.com
          before=$(git rev-parse HEAD)
          echo "BEFORE=$before" >> "$GITHUB_ENV"
          backup="before-repo-cleanup-$(date -u +%Y%m%d-%H%M%S)"
          git tag "$backup" "$before"
          git push origin "refs/tags/$backup"
          echo "BACKUP=$backup" >> "$GITHUB_ENV"
          echo "Backup: $backup at $before"
      - name: Short readme and credits
        env:
          README_B64: 
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os,base64,pathlib
          pathlib.Path('README.md').write_bytes(base64.b64decode(os.environ['README_B64']))
          for name in ['BORROWED.md','PARITY.md','docs/LYRICS_SOURCES.md']:
              pathlib.Path(name).unlink(missing_ok=True)
          PY
          test -f LICENSE
          git diff --exit-code "$BEFORE" -- LICENSE
          git add README.md BORROWED.md PARITY.md docs/LYRICS_SOURCES.md
          git commit -m 'tidy readme'
          git push origin HEAD:main
          echo "DOCS_HEAD=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Shorten messages without changing dates or authors
        env:
          MESSAGE_MAP_B64: 
          FILTER_BRANCH_SQUELCH_WARNING: '1'
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os,base64,pathlib
          pathlib.Path('/tmp/oris-message-map.json').write_bytes(base64.b64decode(os.environ['MESSAGE_MAP_B64']))
          pathlib.Path('/tmp/oris-message-filter.py').write_text('''import json,os,sys
          original=sys.stdin.read()
          mapping=json.load(open('/tmp/oris-message-map.json'))
          message=mapping.get(os.environ['GIT_COMMIT'])
          sys.stdout.write(message+'\\n' if message else original)
          ''')
          PY
          git log --reverse --format='%an%x09%ae%x09%aI%x09%cn%x09%ce%x09%cI' HEAD > /tmp/before-people-dates.txt
          original_tree=$(git rev-parse 'HEAD^{tree}')
          git filter-branch --force --msg-filter 'python3 /tmp/oris-message-filter.py' -- main
          test "$original_tree" = "$(git rev-parse 'HEAD^{tree}')"
          git log --reverse --format='%an%x09%ae%x09%aI%x09%cn%x09%ce%x09%cI' HEAD > /tmp/after-people-dates.txt
          cmp /tmp/before-people-dates.txt /tmp/after-people-dates.txt
          test -f LICENSE
          git push "--force-with-lease=refs/heads/main:$DOCS_HEAD" origin HEAD:main
          echo "Backup: $BACKUP"
          echo "New main: $(git rev-parse HEAD)"
          git log -45 --format='%h %s'
