name: Emulator playback runtime check
on:
  workflow_dispatch:
    inputs:
      check:
        description: Runtime check to run
        required: true
        default: playback
        type: choice
        options:
          - playback
          - diagnostics
          - local
          - offline
          - localsearch
permissions:
  contents: read
jobs:
  runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: temurin
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Prepare debug signing
        run: |
          chmod +x gradlew
          mkdir -p ~/.android
          if [ ! -f ~/.android/debug.keystore ]; then
            keytool -genkeypair -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname 'CN=Android Debug,O=Android,C=US'
          fi
      - name: Inspect ktor resolution
        run: ./gradlew :app:dependencyInsight --dependency ktor-client-content-negotiation --configuration fossDebugRuntimeClasspath --console=plain
      - name: Build FOSS debug APK
        run: ./gradlew :app:assembleFossDebug --console=plain --warning-mode summary
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run emulator playback check
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          target: default
          profile: pixel_6
          ram-size: 3072M
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -feature -Vulkan -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: python3 .github/runtime/${{ inputs.check == 'diagnostics' && 'diagnostic_check.py' || inputs.check == 'local' && 'local_check.py' || inputs.check == 'offline' && 'offline_check.py' || inputs.check == 'localsearch' && 'local_search_check.py' || 'playback_check.py' }}
      - name: Upload runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oris-rebuilt-runtime-evidence
          path: runtime-evidence/
          if-no-files-found: warn
          retention-days: 14
