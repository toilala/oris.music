name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Version tag, for example v1.0.0'
        required: true
      publish:
        description: 'true to publish the release, anything else only builds'
        required: false
        default: 'false'
      notes:
        description: 'Release notes'
        required: false
        default: 'v1'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: temurin
      - uses: gradle/actions/setup-gradle@v4
      - name: Build signed release APK
        env:
          KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          echo "$KEYSTORE_B64" | base64 -d > keystore.jks
          ./gradlew :app:assembleFossRelease --console=plain --warning-mode summary
          rm -f keystore.jks
      - name: Check signature
        run: |
          APK=$(ls app/build/outputs/apk/foss/release/*.apk | head -1)
          "$ANDROID_HOME"/build-tools/$(ls "$ANDROID_HOME"/build-tools | sort -V | tail -1)/apksigner verify --print-certs "$APK"
          cp "$APK" "Oris-${{ inputs.tag }}.apk"
      - name: Keep the APK as an artifact
        uses: actions/upload-artifact@v4
        with:
          name: oris-release-apk
          path: Oris-*.apk
          retention-days: 7
      - name: Publish release
        if: ${{ inputs.publish == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ inputs.tag }}" "Oris-${{ inputs.tag }}.apk" --target "${{ github.sha }}" --title "Oris ${{ inputs.tag }}" --notes "${{ inputs.notes }}"
